name: Watch own repos

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: Watch all owned repos
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          watched=$(gh api --paginate /user/subscriptions --jq '.[].full_name' | sort)
          owned=$(gh api --paginate '/user/repos?affiliation=owner' --jq '.[].full_name' | sort)
          unwatched=$(comm -23 <(echo "$owned") <(echo "$watched"))

          if [ -z "$unwatched" ]; then
            echo "All repos are already watched."
            exit 0
          fi

          echo "Watching new repos:"
          echo "$unwatched" | while read repo; do
            gh api -X PUT "/repos/$repo/subscription" --input - <<< '{"subscribed":true,"ignored":false}' --silent
            echo "  Watching $repo"
          done
